.sidebar {

}

.history {

}

.history-item {
  display: flex;

  border-radius: 8px;

  margin-bottom: 4px;
}

.history-item:hover,

}

.history-name {
  flex: 1;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;

}

.delete-history {
  background: transparent;

}

}

}

}

}

}

.message.user { justify-content: flex-start; }

}

/* Markdown */

.markdown-body {
  line-height: 1.85;
  overflow-wrap: anywhere;
}

.markdown-body h1,
.markdown-body h2,
.markdown-body h3 {
  line-height: 1.5;
  margin: 16px 0 8px;
  color: #fff;
}

.markdown-body h1 { font-size: 23px; }
.markdown-body h2 { font-size: 20px; }
.markdown-body h3 { font-size: 17px; }

.markdown-body p {
  margin: 7px 0;
}

.markdown-body ul,
.markdown-body ol {
  padding-right: 25px;
  margin: 8px 0;
}

.markdown-body li {
  margin: 5px 0;
}

.markdown-body strong { color: #fff; }

.markdown-body blockquote {
  border-right: 3px solid #64748b;

  padding: 5px 12px;
  color: #b7c0ce;
  background: #202631;
  border-radius: 5px;
}

.markdown-body pre {
  direction: ltr;
  text-align: left;
  background: #090c11;
  border: 1px solid #303641;
  padding: 14px;
  border-radius: 10px;
  overflow-x: auto;
  margin: 10px 0;
}

.markdown-body pre code {
  background: transparent;
  padding: 0;
  white-space: pre;
}

.markdown-body code {
  direction: ltr;
  background: #252c38;
  padding: 2px 5px;
  border-radius: 5px;
  font-family: Consolas, monospace;

}

.markdown-body a {
  color: #75baff;
  text-decoration: underline;
  overflow-wrap: anywhere;
}

.markdown-body hr {
  border: 0;
  border-top: 1px solid #303641;
  margin: 15px 0;
}

.markdown-body table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
  display: block;
  overflow-x: auto;
}

.markdown-body th,
.markdown-body td {
  border: 1px solid #303641;
  padding: 8px;
  text-align: right;
}

.markdown-body th { background: #202631; }

/* Thinking */

.thinking-dots {
  display: flex;
  align-items: center;
  gap: 5px;
  height: 24px;
  direction: ltr;
}

.thinking-dots span {
  width: 7px;
  height: 7px;
  background: #9ca3af;
  border-radius: 50%;
  animation: bounce 1.2s infinite ease-in-out;
}

.thinking-dots span:nth-child(2) { animation-delay: .15s; }
.thinking-dots span:nth-child(3) { animation-delay: .3s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: .5; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* الكتابة التدريجية */

.typing-cursor::after {
  content: "";
  display: inline-block;
  width: 2px;
  height: 17px;
  background: #75baff;
  margin-right: 4px;
  vertical-align: middle;
  border-radius: 2px;
  animation: cursorBlink .8s infinite;
}

@keyframes cursorBlink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

<script>

"use strict";

const CLOUDFLARE_URL =
  "https://nova-ai-worker.saidaabou216.workers.dev/api/chat";

const RENDER_URL =
  "https://nova-ai-8v6o.onrender.com/api/chat";

const MAX_HISTORY_MESSAGES = 10;
const MAX_HISTORY_IMAGES = 2;
const PRIMARY_TIMEOUT = 90000;

const $ = id => document.getElementById(id);

let conversations = [];

try {
  const saved = JSON.parse(
    localStorage.getItem("nova_conversations") || "[]"
  );
  conversations = Array.isArray(saved) ? saved : [];
} catch {
  conversations = [];
}

let currentConversationId =
  localStorage.getItem("nova_current_conversation") || null;

let selectedImage = null;
let isSending = false;

function saveConversations() {
  try {
    localStorage.setItem(
      "nova_conversations",
      JSON.stringify(conversations)
    );
  } catch (error) {
    console.error("تعذر حفظ المحادثات:", error);
  }
}

function createId() {
  return Date.now().toString() +
    Math.random().toString(36).slice(2);
}

function getCurrentConversation() {
  return conversations.find(
    c => c.id === currentConversationId
  );
}

function createTitle(text) {
  const clean = (text || "").trim();

  if (!clean) return "محادثة جديدة";

  return clean.length > 30
    ? clean.slice(0, 30) + "..."
    : clean;
}

function createNewConversation() {
  const conversation = {
    id: createId(),
    title: "محادثة جديدة",
    messages: []
  };

  conversations.unshift(conversation);
  currentConversationId = conversation.id;

  localStorage.setItem(
    "nova_current_conversation",
    currentConversationId
  );

  saveConversations();
  renderHistory();
  renderConversation();
  closeMobileMenu();

  $("messageInput").focus();
}

function openConversation(id) {
  currentConversationId = id;

  localStorage.setItem(
    "nova_current_conversation",
    id
  );

  renderHistory();
  renderConversation();
  closeMobileMenu();
}

function deleteConversation(id, event) {
  if (event) event.stopPropagation();

  conversations = conversations.filter(
    c => c.id !== id
  );

  if (currentConversationId === id) {
    currentConversationId = conversations[0]?.id || null;
  }

  if (currentConversationId) {
    localStorage.setItem(
      "nova_current_conversation",
      currentConversationId
    );
  } else {
    localStorage.removeItem("nova_current_conversation");
  }

  saveConversations();
  renderHistory();
  renderConversation();
}

function renderHistory() {
  const history = $("history");
  history.innerHTML = "";

  conversations.forEach(conversation => {
    const item = document.createElement("div");

    item.className = "history-item" +
      (conversation.id === currentConversationId ? " active" : "");

    item.addEventListener("click", () => {
      openConversation(conversation.id);
    });

    const name = document.createElement("div");
    name.className = "history-name";
    name.textContent = conversation.title;

    const del = document.createElement("button");
    del.className = "delete-history";
    del.textContent = "×";
    del.title = "حذف المحادثة";

    del.addEventListener("click", event => {
      deleteConversation(conversation.id, event);
    });

    item.append(name, del);
    history.appendChild(item);
  });
}

function renderConversation() {
  const chat = $("chat");
  chat.innerHTML = "";

  const conversation = getCurrentConversation();

  if (!conversation || !conversation.messages.length) {
    chat.appendChild(createWelcome());
    return;
  }

  conversation.messages.forEach(message => {
    addMessageToScreen(
      message.role,
      message.content,
      message.image
    );
  });

  scrollToBottom();
}

function createWelcome() {
  const welcome = document.createElement("div");
  welcome.className = "welcome";

  const logo = document.createElement("img");
  logo.className = "welcome-logo";
  logo.src = "/logo.png";
  logo.alt = "Nova AI";

  const title = document.createElement("h1");
  title.textContent = "مرحبًا بك في Nova AI";

  const description = document.createElement("p");
  description.textContent = "اسألني أي شيء وسأحاول مساعدتك.";

  welcome.append(logo, title, description);

  return welcome;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function formatInline(text) {
  let result = escapeHTML(text);

  result = result.replace(
    /`([^`]+)`/g,
    "<code>$1</code>"
  );

  result = result.replace(
    /\*\*(.*?)\*\*/g,
    "<strong>$1</strong>"
  );

  result = result.replace(
    /~~(.*?)~~/g,
    "<del>$1</del>"
  );

  result = result.replace(
    /(^|[^*])\*([^*\n]+)\*/g,
    "$1<em>$2</em>"
  );

  result = result.replace(
    /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
  );

  result = result.replace(
    /(?<!href=")(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
  );

  return result;
}

function formatMarkdown(text) {
  const lines = String(text ?? "").replace(/\r\n/g, "\n").split("\n");

  let html = "";
  let inCode = false;
  let codeLines = [];
  let listType = null;
  let inQuote = false;

  function closeList() {
    if (listType) {
      html += listType === "ul" ? "</ul>" : "</ol>";
      listType = null;
    }
  }

  function closeQuote() {
    if (inQuote) {
      html += "</blockquote>";
      inQuote = false;
    }
  }

  for (const line of lines) {
    const trimmed = line.trim();

    if (trimmed.startsWith("```")) {
      closeList();
      closeQuote();

      if (inCode) {
        html += "<pre><code>" +
          escapeHTML(codeLines.join("\n")) +
          "</code></pre>";

        codeLines = [];
        inCode = false;
      } else {
        inCode = true;
      }

      continue;
    }

    if (inCode) {
      codeLines.push(line);
      continue;
    }

    if (!trimmed) {
      closeList();
      closeQuote();
      continue;
    }

    const heading = trimmed.match(/^(#{1,3})\s+(.+)$/);

    if (heading) {
      closeList();
      closeQuote();

      const level = heading[1].length;
      html += `<h${level}>${formatInline(heading[2])}</h${level}>`;
      continue;
    }

    if (/^---+$/.test(trimmed)) {
      closeList();
      closeQuote();
      html += "<hr>";
      continue;
    }

    const quote = trimmed.match(/^>\s?(.*)$/);

    if (quote) {
      closeList();

      if (!inQuote) {
        html += "<blockquote>";
        inQuote = true;
      }

      html += "<p>" + formatInline(quote[1]) + "</p>";
      continue;
    }

    closeQuote();

    const unordered = trimmed.match(/^[-*+]\s+(.+)$/);
    const ordered = trimmed.match(/^\d+[.)]\s+(.+)$/);

    if (unordered) {
      if (listType !== "ul") {
        closeList();
        html += "<ul>";
        listType = "ul";
      }

      html += "<li>" + formatInline(unordered[1]) + "</li>";
      continue;
    }

    if (ordered) {
      if (listType !== "ol") {
        closeList();
        html += "<ol>";
        listType = "ol";
      }

      html += "<li>" + formatInline(ordered[1]) + "</li>";
      continue;
    }

    closeList();
    html += "<p>" + formatInline(trimmed) + "</p>";
  }

  if (inCode) {
    html += "<pre><code>" +
      escapeHTML(codeLines.join("\n")) +
      "</code></pre>";
  }

  closeList();
  closeQuote();

  return html;
}

function addMessageToScreen(role, content, image) {
  const message = document.createElement("div");

  message.className =
    "message " + (role === "user" ? "user" : "ai");

  const box = document.createElement("div");
  box.className = "message-content";

  if (image) {
    const img = document.createElement("img");
    img.src = image;
    img.className = "message-image";
    img.alt = "الصورة المرسلة";
    box.appendChild(img);
  }

  if (content) {
    const text = document.createElement("div");
    text.className = "markdown-body";
    text.innerHTML = formatMarkdown(content);
    box.appendChild(text);
  }

  if (role === "assistant" && content) {
    const copy = document.createElement("button");
    copy.className = "copy-button";
    copy.textContent = "نسخ";

    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(content);
        copy.textContent = "تم النسخ ✓";

        setTimeout(() => {
          copy.textContent = "نسخ";
        }, 1500);
      } catch {
        copy.textContent = "تعذر النسخ";
      }
    });

    box.appendChild(copy);
  }

  message.appendChild(box);
  $("chat").appendChild(message);
}

function addThinkingMessage() {
  const message = document.createElement("div");

  message.className = "message ai";
  message.id = "thinkingMessage";

  const box = document.createElement("div");
  box.className = "message-content";

  box.innerHTML =
    '<div class="thinking-dots"><span></span><span></span><span></span></div>';

  message.appendChild(box);
  $("chat").appendChild(message);
}

function removeThinkingMessage() {
  $("thinkingMessage")?.remove();
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    const chat = $("chat");
    chat.scrollTop = chat.scrollHeight;
  });
}

/* الصور */

function showImagePreview(dataUrl) {
  selectedImage = dataUrl;
  $("imagePreview").src = dataUrl;
  $("imagePreviewWrap").style.display = "block";
}

function clearSelectedImage() {
  selectedImage = null;
  $("imagePreview").src = "";
  $("imagePreviewWrap").style.display = "none";
  $("imageInput").value = "";
}

function readImageFile(file) {
  if (!file || !file.type.startsWith("image/")) return;

  const reader = new FileReader();

  reader.onload = event => {
    showImagePreview(event.target.result);
  };

  reader.onerror = () => {
    alert("تعذر قراءة الصورة. حاول مرة أخرى.");
  };

  reader.readAsDataURL(file);
}

$("attachButton").addEventListener("click", () => {
  $("imageInput").click();
});

$("imageInput").addEventListener("change", event => {
  readImageFile(event.target.files?.[0]);
});

$("removeImageButton").addEventListener("click", clearSelectedImage);

document.addEventListener("paste", event => {
  const items = event.clipboardData?.items;
  if (!items) return;

  for (const item of items) {
    if (item.type && item.type.startsWith("image/")) {
      const file = item.getAsFile();

      if (!file) continue;

      event.preventDefault();
      readImageFile(file);
      return;
    }
  }
});

/* الكتابة والإرسال */

$("messageInput").addEventListener("input", () => {
  const textarea = $("messageInput");
  textarea.style.height = "auto";
  textarea.style.height =
    Math.min(textarea.scrollHeight, 160) + "px";
});

$("messageInput").addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

$("sendButton").addEventListener("click", sendMessage);

function prepareHistory(messages) {
  const recent = messages.slice(-MAX_HISTORY_MESSAGES);
  let imageCount = 0;

  return recent.map(message => {
    let image = message.image || null;

    if (image) {
      imageCount++;
      if (imageCount > MAX_HISTORY_IMAGES) image = null;
    }

    return {
      role: message.role,
      content: message.content || "",
      image
    };
  });
}

/* الاتصال بالخوادم */

async function requestCloudflare(body) {
  const controller = new AbortController();

  const timeout = setTimeout(
    () => controller.abort(),
    PRIMARY_TIMEOUT
  );

  try {
    return await fetch(CLOUDFLARE_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body,
      signal: controller.signal
    });
  } finally {
    clearTimeout(timeout);
  }
}

async function requestRender(body) {
  return fetch(RENDER_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body
  });
}

async function getAIResponse(body) {
  try {
    const response = await requestCloudflare(body);

    if (response.status >= 500) {
      throw new Error("Cloudflare server error");
    }

    if (response.status === 429) {
      const errorText = await response.clone().text();

      if (/1027|daily request limit/i.test(errorText)) {
        throw new Error("Cloudflare limit reached");
      }
    }

    return response;

  } catch (error) {
    console.warn("Cloudflare unavailable; trying Render:", error);
    return requestRender(body);
  }
}

/* قراءة الإجابة التدريجية */

async function readAIResponse(response, onText) {
  const contentType =
    response.headers.get("Content-Type") || "";

  // دعم Render القديم الذي يعيد JSON
  if (!contentType.includes("text/event-stream")) {
    const data = await response.json();

    const answer =
      data.reply ||
      data.message ||
      data.response ||
      "";

    if (answer) onText(answer);

    return {
      answer,
      model: data.model || null
    };
  }

  if (!response.body) {
    throw new Error("الخادم لم يرسل تدفق الإجابة.");
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();

  let buffer = "";
  let answer = "";
  let model = null;

  function processBlock(block) {
    const dataLines = block
      .split(/\r?\n/)
      .filter(line => line.startsWith("data:"))
      .map(line => line.slice(5).trimStart());

    if (!dataLines.length) return;

    const dataText = dataLines.join("\n").trim();

    if (!dataText || dataText === "[DONE]") return;

    let data;

    try {
      data = JSON.parse(dataText);
    } catch {
      return;
    }

    if (typeof data.text === "string" && data.text) {
      answer += data.text;
      onText(answer);
    }

    if (data.model) {
      model = data.model;
    }

    if (data.error) {
      throw new Error(data.error);
    }
  }

  try {
    while (true) {
      const { done, value } = await reader.read();

      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      let boundary;

      while ((boundary = buffer.search(/\r?\n\r?\n/)) !== -1) {
        const block = buffer.slice(0, boundary);
        const separator = buffer.slice(boundary).match(/^\r?\n\r?\n/)[0];

        buffer = buffer.slice(boundary + separator.length);

        processBlock(block);
      }
    }

    buffer += decoder.decode();

    if (buffer.trim()) {
      processBlock(buffer);
    }

    return { answer, model };

  } finally {
    reader.releaseLock();
  }
}

/* فقاعة الإجابة */

function createLiveAnswer() {
  removeThinkingMessage();

  const message = document.createElement("div");
  message.className = "message ai";

  const box = document.createElement("div");
  box.className = "message-content";

  const text = document.createElement("div");
  text.className = "markdown-body typing-cursor";

  box.appendChild(text);
  message.appendChild(box);
  $("chat").appendChild(message);

  return { message, box, text };
}

function addCopyButton(box, answer) {
  const oldButton = box.querySelector(".copy-button");
  if (oldButton) oldButton.remove();

  const copy = document.createElement("button");
  copy.className = "copy-button";
  copy.textContent = "نسخ";

  copy.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(answer);
      copy.textContent = "تم النسخ ✓";

      setTimeout(() => {
        copy.textContent = "نسخ";
      }, 1500);
    } catch {
      copy.textContent = "تعذر النسخ";
    }
  });

  box.appendChild(copy);
}

/* إرسال الرسالة */

async function sendMessage() {
  if (isSending) return;

  const input = $("messageInput");
  const messageText = input.value.trim();
  const imageToSend = selectedImage;

  if (!messageText && !imageToSend) return;

  if (!currentConversationId || !getCurrentConversation()) {
    const conversation = {
      id: createId(),
      title: createTitle(messageText),
      messages: []
    };

    conversations.unshift(conversation);
    currentConversationId = conversation.id;

    localStorage.setItem(
      "nova_current_conversation",
      currentConversationId
    );
  }

  const conversation = getCurrentConversation();

  if (!conversation.messages.length) {
    conversation.title = createTitle(messageText);
  }

  conversation.messages.push({
    role: "user",
    content: messageText,
    image: imageToSend
  });

  saveConversations();
  renderHistory();
  renderConversation();

  input.value = "";
  input.style.height = "auto";
  clearSelectedImage();

  isSending = true;
  $("sendButton").disabled = true;

  addThinkingMessage();
  scrollToBottom();

  const history = prepareHistory(
    conversation.messages.slice(0, -1)
  );

  const requestBody = JSON.stringify({
    message: messageText,
    image: imageToSend,
    history
  });

  let live = null;
  let answer = "";

  function displayAnswer(fullText) {
    answer = fullText;

    if (!live) {
      live = createLiveAnswer();
    }

    live.text.innerHTML = formatMarkdown(answer);
    scrollToBottom();
  }

  try {
    let response = await getAIResponse(requestBody);

    if (!response.ok) {
      const errorText = await response.text();

      throw new Error(
        "HTTP " + response.status + ": " + errorText
      );
    }

    let result;

    try {
      result = await readAIResponse(response, displayAnswer);
    } catch (streamError) {
      // إذا انقطع البث قبل وصول أي نص، نجرب Render.
      if (!answer) {
        console.warn("Cloudflare stream failed; trying Render:", streamError);

        response = await requestRender(requestBody);

        if (!response.ok) {
          throw new Error(
            "Render HTTP " + response.status + ": " +
            await response.text()
          );
        }

        result = await readAIResponse(response, displayAnswer);
      } else {
        throw streamError;
      }
    }

    answer = result.answer || answer;

    if (!answer) {
      throw new Error("لم يتم الحصول على إجابة.");
    }

    if (!live) {
      live = createLiveAnswer();
      live.text.innerHTML = formatMarkdown(answer);
    }

    live.text.classList.remove("typing-cursor");
    addCopyButton(live.box, answer);

    conversation.messages.push({
      role: "assistant",
      content: answer,
      image: null
    });

  } catch (error) {
    console.error("Nova AI error:", error);

    if (answer && live) {
      live.text.classList.remove("typing-cursor");
      addCopyButton(live.box, answer);

      conversation.messages.push({
        role: "assistant",
        content: answer,
        image: null
      });

      const warning = document.createElement("p");
      warning.textContent = "انقطع الاتصال بعد جزء من الإجابة.";
      warning.style.color = "#e5a45b";
      live.box.appendChild(warning);

    } else {
      removeThinkingMessage();

      conversation.messages.push({
        role: "assistant",
        content:
          "حدث خطأ أثناء الاتصال بالخادم. حاول مرة أخرى بعد قليل.",
        image: null
      });
    }

  } finally {
    removeThinkingMessage();

    isSending = false;
    $("sendButton").disabled = false;

    saveConversations();
    renderHistory();
    renderConversation();
    scrollToBottom();
  }
}

/* قائمة الهاتف */

function toggleMobileMenu() {
  const sidebar = $("sidebar");
  const overlay = $("mobileOverlay");

  const isOpen = sidebar.classList.contains("open");

  sidebar.classList.toggle("open", !isOpen);
  overlay.classList.toggle("show", !isOpen);
}

function closeMobileMenu() {
  $("sidebar").classList.remove("open");
  $("mobileOverlay").classList.remove("show");
}

$("menuButton").addEventListener("click", toggleMobileMenu);

$("mobileOverlay").addEventListener("click", closeMobileMenu);

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeMobileMenu();
  }
});

$("newChatButton").addEventListener("click", createNewConversation);

/* تشغيل الموقع */

function init() {
  if (!getCurrentConversation()) {
    currentConversationId = conversations[0]?.id || null;
  }

  if (currentConversationId) {
    localStorage.setItem(
      "nova_current_conversation",
      currentConversationId
    );
  } else {
    localStorage.removeItem("nova_current_conversation");
  }

  renderHistory();
  renderConversation();
}

init();
