<div class="app">

  <aside class="sidebar" id="sidebar">

    </div>

    <button class="new-chat" id="newChatBtn">
      + محادثة جديدة

    <div class="history-title">
      المحادثات
    </div>

    <div class="history" id="history"></div>

  </aside>

  <main class="main">

    <header class="header">

      <button class="menu-btn" id="menuBtn">
        ☰
      </button>

      <div class="header-title">
        Nova AI
      </div>

    </header>

    <div class="chat-container" id="chatContainer">

      <div class="chat" id="chat">

        <div class="welcome" id="welcome">

          <h1>Nova AI</h1>

          <p>
            كيف يمكنني مساعدتك؟
          </p>

        </div>

      </div>

          class="image-preview"
          id="imagePreview">
        </div>

            type="file"
            id="imageInput"
            accept="image/*"
            hidden
          >

            class="image-btn"
            id="imageBtn"
            title="إضافة صورة">
            +
          </button>

          <textarea
            id="messageInput"
            placeholder="اكتب رسالتك..."
            rows="1">
          </textarea>

          <button
            class="send-btn"
            id="sendBtn"
            title="إرسال">
            ↑
          </button>

        </div>

      </div>

    </div>

  </main>

</div>

<script>

const STORAGE_KEY = "nova_conversations";
const CURRENT_KEY = "nova_current_conversation";

/* =========================
   STATE
========================= */

let conversations = [];

let currentConversationId = null;

let selectedImage = null;

let isSending = false;


/* =========================
   LOAD STORAGE SAFELY
========================= */

function loadConversations() {

  try {

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if (!saved) {

      conversations = [];

      return;
    }

    const parsed =
      JSON.parse(saved);

    if (Array.isArray(parsed)) {

      conversations = parsed;

    } else {

      conversations = [];

    }

  } catch (error) {

    console.error(
      "خطأ في قراءة المحادثات:",
      error
    );

    conversations = [];
  }
}


/* =========================
   SAVE
========================= */

function saveConversations() {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(conversations)
    );

  } catch (error) {

    console.error(
      "خطأ في حفظ المحادثات:",
      error
    );

    /*
      إذا امتلأت مساحة localStorage
      بسبب الصور، نحاول حفظ النصوص
      بدون الصور.
    */

    try {

      const smaller =
        conversations.map(conversation => ({

          ...conversation,

          messages:
            conversation.messages.map(message => ({
              role: message.role,
              content: message.content,
              image: null
            }))

        }));

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(smaller)
      );

    } catch (secondError) {

      console.error(
        "تعذر حفظ المحادثات:",
        secondError
      );

    }
  }
}


/* =========================
   CURRENT CHAT
========================= */

function getCurrentConversation() {

  return conversations.find(
    conversation =>
      conversation.id === currentConversationId
  );
}


/* =========================
   CREATE NEW CHAT
========================= */

function createNewConversation() {

  const id =
    Date.now().toString() +
    Math.random()
      .toString(36)
      .slice(2);

  const conversation = {

    id,

    title: "محادثة جديدة",

    messages: [],

    createdAt: Date.now(),

    updatedAt: Date.now()

  };

  conversations.unshift(conversation);

  currentConversationId = id;

  localStorage.setItem(
    CURRENT_KEY,
    id
  );

  saveConversations();

  renderHistory();

  renderConversation();

  messageInput.focus();
}


/* =========================
   OPEN OLD CHAT
========================= */

function openConversation(id) {

  const conversation =
    conversations.find(
      item => item.id === id
    );

  if (!conversation) {

    return;
  }

  currentConversationId =
    conversation.id;

  localStorage.setItem(
    CURRENT_KEY,
    conversation.id
  );

  renderHistory();

  renderConversation();

  /*
    إغلاق القائمة على الهاتف
  */

  sidebar.classList.remove("open");
}


/* =========================
   DELETE CHAT
========================= */

function deleteConversation(id) {

  const index =
    conversations.findIndex(
      item => item.id === id
    );

  if (index === -1) {

    return;
  }

  conversations.splice(index, 1);

  /*
    إذا حذفنا المحادثة الحالية
  */

  if (currentConversationId === id) {

    if (conversations.length > 0) {

      currentConversationId =
        conversations[0].id;

      localStorage.setItem(
        CURRENT_KEY,
        currentConversationId
      );

    } else {

      currentConversationId = null;

      localStorage.removeItem(
        CURRENT_KEY
      );

    }

  }

  saveConversations();

  renderHistory();

  renderConversation();
}


/* =========================
   HISTORY
========================= */

function renderHistory() {

  historyElement.innerHTML = "";

  /*
    الأحدث أولاً
  */

  const sorted =
    [...conversations].sort(
      (a, b) =>
        (b.updatedAt || 0) -
        (a.updatedAt || 0)
    );

  for (const conversation of sorted) {

    const row =
      document.createElement("div");

    row.className =
      "history-item";

    const openButton =
      document.createElement("button");

    openButton.className =
      "history-open";

    if (
      conversation.id ===
      currentConversationId
    ) {

      openButton.classList.add(
        "active"
      );
    }

    openButton.textContent =
      conversation.title ||
      "محادثة جديدة";

    openButton.onclick = () => {

      openConversation(
        conversation.id
      );

    };

    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-chat";

    deleteButton.textContent =
      "×";

    deleteButton.title =
      "حذف المحادثة";

    deleteButton.onclick = event => {

      event.stopPropagation();

      deleteConversation(
        conversation.id
      );

    };

    row.appendChild(openButton);

    row.appendChild(deleteButton);

    historyElement.appendChild(row);
  }
}


/* =========================
   RENDER CURRENT CHAT
========================= */

function renderConversation() {

  chat.innerHTML = "";

  const conversation =
    getCurrentConversation();

  if (
    !conversation ||
    !Array.isArray(
      conversation.messages
    ) ||
    conversation.messages.length === 0
  ) {

    const welcome =
      document.createElement("div");

    welcome.className =
      "welcome";

    welcome.id =
      "welcome";

    welcome.innerHTML = `
      <h1>Nova AI</h1>
      <p>كيف يمكنني مساعدتك؟</p>
    `;

    chat.appendChild(welcome);

    return;
  }

  for (
    const message
    of conversation.messages
  ) {

    addMessageToScreen(
      message.role,
      message.content,
      false,
      message.image || null
    );

  }

  scrollToBottom();
}


/* =========================
   ADD MESSAGE
========================= */

function addMessageToScreen(
  role,
  content,
  shouldScroll = true,
  image = null
) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    `message ${role}`;

  const box =
    document.createElement("div");

  box.className =
    "message-box";

  if (image) {

    const img =
      document.createElement("img");

    img.className =
      "message-image";

    img.src = image;

    img.alt =
      "الصورة المرسلة";

    box.appendChild(img);
  }

  if (content) {

    const text =
      document.createElement("div");

    text.innerHTML =
      formatText(content);

    box.appendChild(text);

    /*
      زر النسخ لرد Nova فقط
    */

    if (role === "assistant") {

      const copy =
        document.createElement("button");

      copy.className =
        "copy-btn";

      copy.textContent =
        "نسخ";

      copy.onclick = async () => {

        try {

          await navigator.clipboard.writeText(
            content
          );

          copy.textContent =
            "تم النسخ";

          setTimeout(() => {

            copy.textContent =
              "نسخ";

          }, 1200);

        } catch {

          copy.textContent =
            "تعذر النسخ";
        }
      };

      box.appendChild(copy);
    }
  }

  wrapper.appendChild(box);

  chat.appendChild(wrapper);

  if (shouldScroll) {

    scrollToBottom();
  }
}


/* =========================
   FORMAT TEXT
========================= */

function escapeHtml(text) {

  return text
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function formatText(text) {

  let safe =
    escapeHtml(text);

  /*
    code blocks
  */

  safe =
    safe.replace(
      /```([\s\S]*?)```/g,
      (_, code) => {

        return `
          <div class="code-block">
            ${code.trim()}
          </div>
        `;

      }
    );

  /*
    markdown links
  */

  safe =
    safe.replace(
      /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
    );

  /*
    raw links
  */

  safe =
    safe.replace(
      /(^|[\s>])(https?:\/\/[^\s<]+)/g,
      '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>'
    );

  /*
    bold
  */

  safe =
    safe.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );

  /*
    italic
  */

  safe =
    safe.replace(
      /(^|[^\*])\*([^*\n]+)\*/g,
      "$1<em>$2</em>"
    );

  /*
    new lines
  */

  safe =
    safe.replace(
      /\n/g,
      "<br>"
    );

  return safe;
}


/* =========================
   SCROLL
========================= */

function scrollToBottom() {

  setTimeout(() => {

    chatContainer.scrollTop =
      chatContainer.scrollHeight;

  }, 50);
}


/* =========================
   TYPING
========================= */

function showTyping() {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message assistant";

  wrapper.id =
    "typingMessage";

  wrapper.innerHTML = `
    <div class="message-box">
      <div class="typing">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  `;

  chat.appendChild(wrapper);

  scrollToBottom();
}


function hideTyping() {

  const typing =
    document.getElementById(
      "typingMessage"
    );

  if (typing) {

    typing.remove();
  }
}


/* =========================
   IMAGE
========================= */

function clearSelectedImage() {

  selectedImage = null;

  imageInput.value = "";

  imagePreview.innerHTML = "";
}


imageBtn.addEventListener(
  "click",
  () => {

    imageInput.click();

  }
);


imageInput.addEventListener(
  "change",
  () => {

    const file =
      imageInput.files[0];

    if (!file) {

      return;
    }

    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      return;
    }

    /*
      منع الصور الضخمة جدًا
    */

    if (
      file.size >
      8 * 1024 * 1024
    ) {

      alert(
        "الصورة كبيرة جدًا. اختر صورة أقل من 8MB."
      );

      imageInput.value = "";

      return;
    }

    const reader =
      new FileReader();

    reader.onload = () => {

      selectedImage =
        reader.result;

      imagePreview.innerHTML =
        "";

      const wrapper =
        document.createElement(
          "div"
        );

      wrapper.className =
        "preview-wrapper";

      const img =
        document.createElement(
          "img"
        );

      img.src =
        selectedImage;

      const remove =
        document.createElement(
          "button"
        );

      remove.className =
        "remove-image";

      remove.textContent =
        "×";

      remove.onclick =
        clearSelectedImage;

      wrapper.appendChild(img);

      wrapper.appendChild(remove);

      imagePreview.appendChild(
        wrapper
      );
    };

    reader.readAsDataURL(file);
  }
);


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

  if (isSending) {

    return;
  }

  const message =
    messageInput.value.trim();

  if (
    !message &&
    !selectedImage
  ) {

    return;
  }

  /*
    لا تنشئ محادثة جديدة
    إلا إذا لم تكن هناك محادثة
  */

  if (!currentConversationId) {

    createNewConversation();
  }

  const conversation =
    getCurrentConversation();

  if (!conversation) {

    return;
  }

  isSending = true;

  const imageToSend =
    selectedImage;

  /*
    حفظ رسالة المستخدم
  */

  conversation.messages.push({

    role: "user",

    content: message,

    image:
      imageToSend || null

  });

  /*
    عنوان المحادثة يؤخذ
    من أول رسالة فقط
  */

  if (
    conversation.messages.length === 1
  ) {

    if (message) {

      conversation.title =
        message
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, 45);

    } else {

      conversation.title =
        "صورة جديدة";
    }
  }

  conversation.updatedAt =
    Date.now();

  saveConversations();

  renderHistory();

  /*
    عرض رسالة المستخدم
  */

  addMessageToScreen(
    "user",
    message,
    true,
    imageToSend
  );

  messageInput.value = "";

  messageInput.style.height =
    "auto";

  clearSelectedImage();

  showTyping();

  try {

    /*
      نرسل تاريخ المحادثة
      بدون الرسالة الحالية
    */

    const history =
      conversation.messages
        .slice(0, -1)
        .map(item => ({

          role: item.role,

          content:
            item.content || ""

        }));

    const response =
      await fetch(
        "/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                message,

              image:
                imageToSend,

              history:
                history

            })

        }
      );

    const data =
      await response.json();

    hideTyping();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "حدث خطأ"
      );
    }

    const reply =
      data.reply ||
      "لم أحصل على إجابة.";

    /*
      حفظ رد Nova
    */

    conversation.messages.push({

      role: "assistant",

      content: reply,

      image: null

    });

    conversation.updatedAt =
      Date.now();

    saveConversations();

    renderHistory();

    addMessageToScreen(
      "assistant",
      reply,
      true
    );

  } catch (error) {

    hideTyping();

    console.error(error);

    const errorMessage =
      "حدث خطأ أثناء الاتصال بـ Nova AI.";

    conversation.messages.push({

      role: "assistant",

      content: errorMessage,

      image: null

    });

    conversation.updatedAt =
      Date.now();

    saveConversations();

    addMessageToScreen(
      "assistant",
      errorMessage,
      true
    );

  } finally {

    isSending = false;

    messageInput.focus();
  }
}

/* =========================
   STARTUP
========================= */

loadConversations();

const savedCurrent =
  localStorage.getItem(
    CURRENT_KEY
  );

/*
  إذا كانت المحادثة المحفوظة
  مازالت موجودة، افتحها.
*/

if (
  savedCurrent &&
  conversations.some(
    item =>
      item.id === savedCurrent
  )
) {

  currentConversationId =
    savedCurrent;

} else if (
  conversations.length > 0
) {

  /*
    إذا لم توجد محادثة حالية
    نفتح آخر محادثة.
  */

  const sorted =
    [...conversations].sort(
      (a, b) =>
        (b.updatedAt || 0) -
        (a.updatedAt || 0)
    );

  currentConversationId =
    sorted[0].id;

  localStorage.setItem(
    CURRENT_KEY,
    currentConversationId
  );
}

renderHistory();

renderConversation();

messageInput.focus();
