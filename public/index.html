<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Nova AI</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Arial,
        Tahoma,
        sans-serif;

      background: #0b0d12;
      color: #f1f1f1;

      height: 100vh;
      overflow: hidden;
    }

    button,
    textarea {
      font-family: inherit;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    .sidebar {
      width: 270px;
      background: #10131a;
      border-left: 1px solid #222631;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: 0.25s;
    }

    .sidebar-top {
      padding: 18px;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
      color: white;
      margin-bottom: 18px;
    }

    .new-chat {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #303541;
      background: #191d26;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      text-align: right;
      font-size: 14px;
      transition: 0.2s;
    }

    .new-chat:hover {
      background: #222732;
    }

    .history-title {
      padding: 12px 18px;
      color: #8e96a5;
      font-size: 13px;
      border-top: 1px solid #222631;
    }

    .history {
      flex: 1;
      overflow-y: auto;
      padding: 5px 10px 15px;
    }

    .history-empty {
      color: #707786;
      text-align: center;
      font-size: 13px;
      margin-top: 25px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      border: none;
      background: transparent;
      color: #d7d9df;
      padding: 11px 10px;
      border-radius: 8px;
      cursor: pointer;
      text-align: right;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .history-item:hover {
      background: #1b1f28;
    }

    .history-item.active {
      background: #252a35;
      color: white;
    }

    .history-text {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
    }

    .delete-chat {
      display: none;
      background: transparent;
      border: none;
      color: #8d94a2;
      cursor: pointer;
      font-size: 16px;
      padding: 3px;
    }

    .history-item:hover .delete-chat {
      display: block;
    }

    .delete-chat:hover {
      color: #ff6b6b;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #0b0d12;
    }

    .header {
      height: 60px;
      border-bottom: 1px solid #222631;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 16px;
      font-weight: bold;
    }

    .menu-btn {
      display: none;
      background: transparent;
      border: none;
      color: white;
      font-size: 23px;
      cursor: pointer;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .chat {
      width: min(850px, 94%);
      margin: auto;
      padding: 35px 0 150px;
    }

    .welcome {
      text-align: center;
      padding: 90px 20px 40px;
    }

    .welcome h1 {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #9097a5;
      font-size: 15px;
    }

    .welcome.hidden {
      display: none;
    }

    .message {
      display: flex;
      margin-bottom: 25px;
      animation: appear 0.2s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.ai {
      justify-content: flex-end;
    }

    .message-box {
      max-width: 82%;
      line-height: 1.8;
      font-size: 15px;
      word-wrap: break-word;
    }

    .user .message-box {
      background: #20242d;
      padding: 12px 16px;
      border-radius: 16px 16px 4px 16px;
    }

    .ai .message-box {
      width: 100%;
      padding: 5px 0;
    }

    .message-label {
      font-size: 11px;
      color: #737b8a;
      margin-bottom: 5px;
    }

    .message-image {
      max-width: 280px;
      max-height: 250px;
      display: block;
      border-radius: 12px;
      margin-bottom: 8px;
      border: 1px solid #303541;
    }

    .message-box a {
      color: #72a7ff;
      text-decoration: none;
    }

    .message-box a:hover {
      text-decoration: underline;
    }

    .message-box strong {
      font-weight: bold;
      color: white;
    }

    .message-box em {
      font-style: italic;
    }

    .message-box code {
      background: #171a21;
      border: 1px solid #282d38;
      padding: 2px 5px;
      border-radius: 5px;
      font-family: Consolas, monospace;
      direction: ltr;
      display: inline-block;
    }

    .code-block {
      direction: ltr;
      text-align: left;
      background: #090b0f;
      border: 1px solid #272c36;
      border-radius: 10px;
      padding: 15px;
      margin: 12px 0;
      overflow-x: auto;
      white-space: pre-wrap;
      font-family: Consolas, monospace;
      font-size: 13px;
    }

    .copy-btn {
      margin-top: 7px;
      background: transparent;
      border: 1px solid #2c313c;
      color: #8e96a5;
      border-radius: 7px;
      padding: 5px 9px;
      cursor: pointer;
      font-size: 11px;
    }

    .copy-btn:hover {
      background: #191d25;
      color: white;
    }

    .typing {
      display: none;
      margin-bottom: 25px;
    }

    .typing.show {
      display: block;
    }

    .typing-dots {
      display: flex;
      gap: 5px;
      padding: 10px 0;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      background: #777f8e;
      border-radius: 50%;
      animation: typing 1.2s infinite;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        opacity: 0.25;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    .input-area {
      position: fixed;
      bottom: 0;
      right: 270px;
      left: 0;
      background:
        linear-gradient(
          to top,
          #0b0d12 70%,
          rgba(11,13,18,0)
        );
      padding: 20px 20px 18px;
      z-index: 10;
    }

    .input-box {
      width: min(850px, 94%);
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: #171a21;
      border: 1px solid #303541;
      border-radius: 14px;
      padding: 8px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      min-height: 42px;
      max-height: 180px;
      padding: 10px;
      font-size: 15px;
      line-height: 1.5;
      direction: rtl;
    }

    textarea::placeholder {
      color: #707786;
    }

    .image-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid #303541;
      background: #20242d;
      color: white;
      cursor: pointer;
      font-size: 23px;
    }

    .image-btn:hover {
      background: #292e39;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: none;
      background: #f1f1f1;
      color: #111;
      cursor: pointer;
      font-size: 20px;
      font-weight: bold;
    }

    .send-btn:hover {
      background: white;
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .image-preview {
      width: min(850px, 94%);
      margin: 8px auto 0;
    }

    .preview-wrapper {
      position: relative;
      display: inline-block;
    }

    .image-preview img {
      max-width: 180px;
      max-height: 140px;
      border-radius: 10px;
      border: 1px solid #303541;
    }

    .remove-image {
      position: absolute;
      top: -7px;
      left: -7px;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      border: none;
      background: #252a35;
      color: white;
      cursor: pointer;
    }

    .input-hint {
      width: min(850px, 94%);
      margin: 7px auto 0;
      text-align: center;
      color: #555d6c;
      font-size: 10px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 90;
    }

    .overlay.show {
      display: block;
    }

    @media (max-width: 700px) {

      .sidebar {
        position: fixed;
        right: -280px;
        top: 0;
        bottom: 0;
        z-index: 100;
        box-shadow:
          -10px 0 30px
          rgba(0,0,0,0.35);
      }

      .sidebar.open {
        right: 0;
      }

      .menu-btn {
        display: block;
      }

      .header {
        padding: 0 15px;
      }

      .input-area {
        right: 0;
        padding: 15px 10px;
      }

      .chat {
        width: 94%;
        padding-top: 25px;
      }

      .message-box {
        max-width: 90%;
      }

      .welcome {
        padding-top: 70px;
      }

      .welcome h1 {
        font-size: 28px;
      }

    }

  </style>

</head>

<body>

<div class="app">

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-top">

      <div class="logo">
        Nova AI
      </div>

      <button
        class="new-chat"
        id="newChatBtn"
      >
        + محادثة جديدة
      </button>

    </div>

    <div class="history-title">
      المحادثات
    </div>

    <div
      class="history"
      id="history"
    ></div>

  </aside>

  <div
    class="overlay"
    id="overlay"
  ></div>

  <main class="main">

    <header class="header">

      <button
        class="menu-btn"
        id="menuBtn"
      >
        ☰
      </button>

      <div
        class="header-title"
        id="headerTitle"
      >
        Nova AI
      </div>

      <div></div>

    </header>

    <div
      class="chat-container"
      id="chatContainer"
    >

      <div
        class="chat"
        id="chat"
      >

        <div
          class="welcome"
          id="welcome"
        >

          <h1>
            Nova AI
          </h1>

          <p>
            كيف يمكنني مساعدتك اليوم؟
          </p>

        </div>

        <div
          class="typing"
          id="typing"
        >

          <div class="message-label">
            Nova AI
          </div>

          <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>

        </div>

      </div>

    </div>

    <div class="input-area">

      <div class="input-box">

        <input
          type="file"
          id="imageInput"
          accept="image/*"
          hidden
        >

        <button
          class="image-btn"
          id="imageBtn"
          title="إضافة صورة"
        >
          +
        </button>

        <textarea
          id="messageInput"
          placeholder="اكتب رسالتك..."
          rows="1"
        ></textarea>

        <button
          class="send-btn"
          id="sendBtn"
          title="إرسال"
        >
          ↑
        </button>

      </div>

      <div
        class="image-preview"
        id="imagePreview"
      ></div>

      <div class="input-hint">
        Enter للإرسال — Shift + Enter لسطر جديد
      </div>

    </div>

  </main>

</div>

<script>

  const messageInput =
    document.getElementById("messageInput");

  const sendBtn =
    document.getElementById("sendBtn");

  const chat =
    document.getElementById("chat");

  const welcome =
    document.getElementById("welcome");

  const typing =
    document.getElementById("typing");

  const historyElement =
    document.getElementById("history");

  const newChatBtn =
    document.getElementById("newChatBtn");

  const sidebar =
    document.getElementById("sidebar");

  const overlay =
    document.getElementById("overlay");

  const menuBtn =
    document.getElementById("menuBtn");

  const headerTitle =
    document.getElementById("headerTitle");

  const imageInput =
    document.getElementById("imageInput");

  const imageBtn =
    document.getElementById("imageBtn");

  const imagePreview =
    document.getElementById("imagePreview");


  let conversations =
    JSON.parse(
      localStorage.getItem(
        "nova_conversations"
      ) || "[]"
    );

  let currentConversationId =
    localStorage.getItem(
      "nova_current_conversation"
    ) || null;

  let selectedImage = null;


  function saveConversations() {

    localStorage.setItem(
      "nova_conversations",
      JSON.stringify(conversations)
    );

    if (currentConversationId) {

      localStorage.setItem(
        "nova_current_conversation",
        currentConversationId
      );

    }

  }


  function createId() {

    return (
      Date.now().toString() +
      Math.random()
        .toString(36)
        .substring(2)
    );

  }


  function getCurrentConversation() {

    return conversations.find(
      conversation =>
        conversation.id ===
        currentConversationId
    );

  }


  function createTitle(text) {

    let title =
      text
        .replace(/\s+/g, " ")
        .trim();

    if (title.length > 35) {

      title =
        title.substring(0, 35) + "...";

    }

    return title || "محادثة جديدة";

  }


  function createNewConversation() {

    const conversation = {

      id: createId(),

      title: "محادثة جديدة",

      messages: [],

      createdAt: Date.now(),

      updatedAt: Date.now()

    };

    conversations.unshift(conversation);

    currentConversationId =
      conversation.id;

    saveConversations();

    renderHistory();

    renderConversation(conversation);

    headerTitle.textContent =
      "Nova AI";

    clearSelectedImage();

    closeMobileMenu();

  }


  function openConversation(id) {

    const conversation =
      conversations.find(
        c => c.id === id
      );

    if (!conversation) return;

    currentConversationId = id;

    saveConversations();

    renderConversation(conversation);

    headerTitle.textContent =
      conversation.title === "محادثة جديدة"
        ? "Nova AI"
        : conversation.title;

    renderHistory();

    clearSelectedImage();

    closeMobileMenu();

  }


  function deleteConversation(id, event) {

    event.stopPropagation();

    conversations =
      conversations.filter(
        c => c.id !== id
      );

    if (currentConversationId === id) {

      currentConversationId = null;

      localStorage.removeItem(
        "nova_current_conversation"
      );

      saveConversations();

      renderHistory();

      resetChat();

    } else {

      saveConversations();

      renderHistory();

    }

  }


  function renderHistory() {

    historyElement.innerHTML = "";

    if (conversations.length === 0) {

      const empty =
        document.createElement("div");

      empty.className =
        "history-empty";

      empty.textContent =
        "لا توجد محادثات بعد";

      historyElement.appendChild(empty);

      return;

    }

    conversations.forEach(conversation => {

      const item =
        document.createElement("button");

      item.className =
        "history-item";

      if (
        conversation.id ===
        currentConversationId
      ) {

        item.classList.add("active");

      }

      const text =
        document.createElement("span");

      text.className =
        "history-text";

      text.textContent =
        conversation.title;

      const deleteBtn =
        document.createElement("button");

      deleteBtn.className =
        "delete-chat";

      deleteBtn.textContent =
        "×";

      deleteBtn.title =
        "حذف المحادثة";

      deleteBtn.addEventListener(
        "click",
        event =>
          deleteConversation(
            conversation.id,
            event
          )
      );

      item.appendChild(text);

      item.appendChild(deleteBtn);

      item.addEventListener(
        "click",
        () =>
          openConversation(
            conversation.id
          )
      );

      historyElement.appendChild(item);

    });

  }


  function renderConversation(conversation) {

    chat.innerHTML = "";

    if (
      !conversation ||
      conversation.messages.length === 0
    ) {

      chat.appendChild(welcome);

      welcome.classList.remove("hidden");

      chat.appendChild(typing);

      typing.classList.remove("show");

      return;

    }

    welcome.classList.add("hidden");

    conversation.messages.forEach(message => {

      addMessageToScreen(
        message.role,
        message.content,
        false,
        message.image || null
      );

    });

    chat.appendChild(typing);

    typing.classList.remove("show");

    scrollToBottom();

  }


  function resetChat() {

    chat.innerHTML = "";

    welcome.classList.remove("hidden");

    chat.appendChild(welcome);

    chat.appendChild(typing);

    typing.classList.remove("show");

    headerTitle.textContent =
      "Nova AI";

    messageInput.value = "";

    clearSelectedImage();

    autoResize();

  }


  function escapeHtml(text) {

    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function formatText(text) {

    let safe =
      escapeHtml(text);

    safe =
      safe.replace(
        /```([\s\S]*?)```/g,
        '<pre class="code-block">$1</pre>'
      );

    safe =
      safe.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
      );

    safe =
      safe.replace(
        /(?<!["'=])(https?:\/\/[^\s<]+)/g,
        '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
      );

    safe =
      safe.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
      );

    safe =
      safe.replace(
        /(?<!\*)\*([^*]+)\*(?!\*)/g,
        "<em>$1</em>"
      );

    safe =
      safe.replace(/\n/g, "<br>");

    return safe;

  }


  function addMessageToScreen(
    role,
    content,
    scroll = true,
    image = null
  ) {

    const message =
      document.createElement("div");

    message.className =
      "message " +
      (
        role === "user"
          ? "user"
          : "ai"
      );

    const box =
      document.createElement("div");

    box.className =
      "message-box";

    const label =
      document.createElement("div");

    label.className =
      "message-label";

    label.textContent =
      role === "user"
        ? "أنت"
        : "Nova AI";

    box.appendChild(label);

    if (image) {

      const img =
        document.createElement("img");

      img.className =
        "message-image";

      img.src = image;

      img.alt =
        "الصورة المرسلة";

      box.appendChild(img);

    }

    if (content) {

      const contentElement =
        document.createElement("div");

      contentElement.innerHTML =
        formatText(content);

      box.appendChild(contentElement);

    }

    if (role === "assistant") {

      const copyButton =
        document.createElement("button");

      copyButton.className =
        "copy-btn";

      copyButton.textContent =
        "نسخ";

      copyButton.addEventListener(
        "click",
        async () => {

          try {

            await navigator
              .clipboard
              .writeText(content);

            copyButton.textContent =
              "تم النسخ";

            setTimeout(
              () => {

                copyButton.textContent =
                  "نسخ";

              },
              1500
            );

          } catch {

            copyButton.textContent =
              "تعذر النسخ";

          }

        }
      );

      box.appendChild(copyButton);

    }

    message.appendChild(box);

    chat.insertBefore(
      message,
      typing
    );

    if (scroll) {
      scrollToBottom();
    }

  }


  async function sendMessage() {

    const message =
      messageInput.value.trim();

    if (!message && !selectedImage) {
      return;
    }

    if (!currentConversationId) {
      createNewConversation();
    }

    const conversation =
      getCurrentConversation();

    if (!conversation) {
      return;
    }

    if (
      conversation.messages.length === 0
    ) {

      conversation.title =
        createTitle(
          message || "صورة"
        );

      headerTitle.textContent =
        conversation.title;

    }

    conversation.messages.push({

      role: "user",

      content:
        message ||
        "حلل هذه الصورة.",

      image:
        selectedImage || null

    });

    conversation.updatedAt =
      Date.now();

    saveConversations();

    renderHistory();

    addMessageToScreen(
      "user",
      message ||
        "حلل هذه الصورة.",
      true,
      selectedImage
    );

    const imageToSend =
      selectedImage;

    messageInput.value = "";

    clearSelectedImage();

    autoResize();

    sendBtn.disabled = true;

    typing.classList.add("show");

    scrollToBottom();

    try {

      const history =
        conversation.messages.map(
          item => ({
            role: item.role,
            content: item.content
          })
        );

      const response =
        await fetch(
          "https://nova-ai-8v6o.onrender.com/api/chat",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                message:
                  message,

                image:
                  imageToSend,

                history:
                  history.slice(0, -1)

              })
          }
        );

      const data =
        await response.json();

      if (!response.ok) {

        throw new Error(
          data.error ||
          "حدث خطأ"
        );

      }

      const reply =
        data.reply ||
        "لم تصل إجابة.";

      conversation.messages.push({

        role:
          "assistant",

        content:
          reply

      });

      conversation.updatedAt =
        Date.now();

      saveConversations();

      typing.classList.remove("show");

      addMessageToScreen(
        "assistant",
        reply
      );

      renderHistory();

    }

    catch (error) {

      console.error(error);

      typing.classList.remove("show");

      const errorMessage =
        "حدث خطأ أثناء الاتصال بـ Nova AI.";

      conversation.messages.push({

        role:
          "assistant",

        content:
          errorMessage

      });

      saveConversations();

      addMessageToScreen(
        "assistant",
        errorMessage
      );

    }

    finally {

      sendBtn.disabled =
        false;

      messageInput.focus();

      scrollToBottom();

    }

  }


  imageBtn.addEventListener(
    "click",
    () => {
      imageInput.click();
    }
  );


  imageInput.addEventListener(
    "change",
    () => {

      const file =
        imageInput.files[0];

      if (!file) {
        return;
      }

      if (
        !file.type.startsWith("image/")
      ) {
        return;
      }

      const reader =
        new FileReader();

      reader.onload = () => {

        selectedImage =
          reader.result;

        imagePreview.innerHTML =
          "";

        const wrapper =
          document.createElement("div");

        wrapper.className =
          "preview-wrapper";

        const img =
          document.createElement("img");

        img.src =
          selectedImage;

        const remove =
          document.createElement("button");

        remove.className =
          "remove-image";

        remove.textContent =
          "×";

        remove.addEventListener(
          "click",
          clearSelectedImage
        );

        wrapper.appendChild(img);

        wrapper.appendChild(remove);

        imagePreview.appendChild(wrapper);

      };

      reader.readAsDataURL(file);

    }
  );


  function clearSelectedImage() {

    selectedImage = null;

    imageInput.value = "";

    imagePreview.innerHTML = "";

  }


  function autoResize() {

    messageInput.style.height =
      "auto";

    messageInput.style.height =
      Math.min(
        messageInput.scrollHeight,
        180
      ) + "px";

  }


  function scrollToBottom() {

    setTimeout(
      () => {

        const container =
          document.getElementById(
            "chatContainer"
          );

        container.scrollTop =
          container.scrollHeight;

      },
      50
    );

  }


  function openMobileMenu() {

    sidebar.classList.add("open");

    overlay.classList.add("show");

  }


  function closeMobileMenu() {

    sidebar.classList.remove("open");

    overlay.classList.remove("show");

  }


  sendBtn.addEventListener(
    "click",
    sendMessage
  );


  messageInput.addEventListener(
    "input",
    autoResize
  );


  messageInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  newChatBtn.addEventListener(
    "click",
    createNewConversation
  );


  menuBtn.addEventListener(
    "click",
    openMobileMenu
  );


  overlay.addEventListener(
    "click",
    closeMobileMenu
  );


  renderHistory();


  if (currentConversationId) {

    const conversation =
      getCurrentConversation();

    if (conversation) {

      renderConversation(
        conversation
      );

      if (
        conversation.title !==
        "محادثة جديدة"
      ) {

        headerTitle.textContent =
          conversation.title;

      }

    } else {

      currentConversationId =
        null;

      localStorage.removeItem(
        "nova_current_conversation"
      );

      resetChat();

    }

  } else {

    resetChat();

  }

</script>

</body>

</html>
