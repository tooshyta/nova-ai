<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Nova AI</title>

  <link rel="icon" type="image/png" href="/logo.png">

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #0b0e13;
      color: white;
      overflow: hidden;
    }

    body {
      display: flex;
    }

    /* =========================
       الشعار أعلى اليسار
    ========================= */

    .top-logo {
      position: fixed;
      top: 10px;
      left: 15px;

      display: flex;
      align-items: center;

      gap: 9px;

      text-decoration: none;
      color: white;

      z-index: 300;

      direction: ltr;

      cursor: pointer;
    }

    .top-logo img {
      width: 40px;
      height: 40px;

      object-fit: cover;

      border-radius: 12px;

      border: 1px solid #303541;

      display: block;
    }

    .top-logo span {
      font-size: 17px;
      font-weight: bold;

      white-space: nowrap;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 270px;
      height: 100vh;

      background: #10131a;

      border-left: 1px solid #252a33;

      display: flex;
      flex-direction: column;

      padding: 15px;

      flex-shrink: 0;

      z-index: 100;
    }

    .sidebar-title {
      font-size: 21px;
      font-weight: bold;

      margin-bottom: 18px;

      text-align: right;
    }

    .new-chat {
      width: 100%;

      border: none;
      border-radius: 10px;

      background: #202631;

      color: white;

      padding: 12px;

      font-size: 15px;

      cursor: pointer;

      transition: 0.2s;
    }

    .new-chat:hover {
      background: #2b3340;
    }

    .history-title {
      margin-top: 22px;
      margin-bottom: 10px;

      color: #9ca3af;

      font-size: 13px;
    }

    .history {
      flex: 1;

      overflow-y: auto;
    }

    .history-item {
      display: flex;
      align-items: center;

      justify-content: space-between;

      gap: 8px;

      padding: 10px;

      border-radius: 8px;

      cursor: pointer;

      margin-bottom: 4px;

      transition: 0.2s;
    }

    .history-item:hover {
      background: #1b2029;
    }

    .history-item.active {
      background: #222936;
    }

    .history-name {
      flex: 1;

      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;

      font-size: 14px;
    }

    .delete-history {
      background: transparent;

      border: none;

      color: #777;

      cursor: pointer;

      font-size: 16px;

      padding: 2px 5px;
    }

    .delete-history:hover {
      color: #ff5c5c;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      flex: 1;

      height: 100vh;

      display: flex;

      flex-direction: column;

      min-width: 0;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      height: 60px;

      border-bottom: 1px solid #252a33;

      display: flex;

      align-items: center;

      justify-content: center;

      position: relative;

      flex-shrink: 0;
    }

    .header-title {
      font-size: 18px;

      font-weight: bold;
    }

    .menu-button {
      display: none;

      position: absolute;

      right: 15px;

      background: #202631;

      border: none;

      color: white;

      width: 40px;

      height: 40px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 20px;
    }

    /* =========================
       CHAT
    ========================= */

    .chat {
      flex: 1;

      overflow-y: auto;

      padding: 25px;

      scroll-behavior: smooth;
    }

    .welcome {
      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      text-align: center;

      gap: 12px;
    }

    .welcome-logo {
      width: 70px;
      height: 70px;

      object-fit: cover;

      border-radius: 18px;

      border: 1px solid #303541;

      margin-bottom: 5px;
    }

    .welcome h1 {
      margin: 0;

      font-size: 28px;
    }

    .welcome p {
      margin: 0;

      color: #9ca3af;

      font-size: 15px;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      display: flex;

      margin-bottom: 18px;

      width: 100%;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.ai {
      justify-content: flex-end;
    }

    .message-content {
      max-width: 80%;

      padding: 12px 15px;

      border-radius: 14px;

      line-height: 1.7;

      font-size: 15px;

      word-wrap: break-word;
    }

    .message.user .message-content {
      background: #202631;

      border-bottom-left-radius: 5px;
    }

    .message.ai .message-content {
      background: #151a22;

      border: 1px solid #252b35;

      border-bottom-right-radius: 5px;
    }

    .message-image {
      max-width: 300px;

      max-height: 300px;

      object-fit: contain;

      border-radius: 12px;

      display: block;

      margin-bottom: 8px;
    }

    .copy-button {
      display: block;

      margin-top: 8px;

      background: transparent;

      border: 1px solid #303641;

      color: #9ca3af;

      padding: 5px 9px;

      border-radius: 7px;

      cursor: pointer;

      font-size: 12px;
    }

    .copy-button:hover {
      background: #202631;

      color: white;
    }

    /* =========================
       INPUT AREA
    ========================= */

    .input-area {
      padding: 15px 20px 20px;

      flex-shrink: 0;
    }

    .input-box {
      max-width: 900px;

      margin: auto;

      background: #151a22;

      border: 1px solid #303641;

      border-radius: 16px;

      padding: 10px;

      display: flex;

      align-items: flex-end;

      gap: 8px;
    }

    textarea {
      flex: 1;

      resize: none;

      max-height: 160px;

      min-height: 42px;

      background: transparent;

      border: none;

      outline: none;

      color: white;

      font-family: inherit;

      font-size: 15px;

      line-height: 1.5;

      padding: 9px;

    }

    textarea::placeholder {
      color: #737b88;
    }

    .input-button {
      width: 40px;

      height: 40px;

      border: none;

      border-radius: 10px;

      background: #202631;

      color: white;

      cursor: pointer;

      font-size: 18px;

      flex-shrink: 0;
    }

    .input-button:hover {
      background: #2b3340;
    }

    .send-button {
      background: #ffffff;

      color: #000000;

      font-size: 17px;

      font-weight: bold;
    }

    .send-button:hover {
      background: #dddddd;
    }

    .image-preview {
      max-width: 80px;

      max-height: 80px;

      border-radius: 10px;

      object-fit: cover;

      display: none;

      margin: 0 4px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .sidebar {
        position: fixed;

        right: -280px;

        top: 0;

        transition: right 0.25s ease;

        z-index: 200;
      }

      .sidebar.open {
        right: 0;
      }

      .main {
        width: 100%;
      }

      .menu-button {
        display: block;
      }

      .top-logo {
        left: 12px;
        top: 9px;
      }

      .top-logo img {
        width: 38px;
        height: 38px;

        border-radius: 11px;
      }

      .top-logo span {
        font-size: 15px;
      }

      .chat {
        padding: 18px 12px;
      }

      .message-content {
        max-width: 90%;
      }

      .input-area {
        padding: 10px;
      }

      .welcome h1 {
        font-size: 24px;
      }

    }

  </style>

</head>

<body>

  <!-- =========================
       الشعار أعلى اليسار
       الضغط عليه يعيد الصفحة
  ========================= -->

  <a
    href="/"
    class="top-logo"
    title="Nova AI"
  >
    <img
      src="/logo.png"
      alt="Nova AI"
    >

    <span>Nova AI</span>
  </a>


  <!-- =========================
       SIDEBAR
  ========================= -->

  <aside class="sidebar" id="sidebar">

    <div class="sidebar-title">
      Nova AI
    </div>

    <button
      class="new-chat"
      onclick="createNewConversation()"
    >
      ＋ محادثة جديدة
    </button>

    <div class="history-title">
      المحادثات
    </div>

    <div
      class="history"
      id="history"
    ></div>

  </aside>


  <!-- =========================
       MAIN
  ========================= -->

  <main class="main">

    <header class="header">

      <button
        class="menu-button"
        onclick="openMobileMenu()"
      >
        ☰
      </button>

      <div class="header-title">
        Nova AI
      </div>

    </header>


    <!-- CHAT -->

    <section
      class="chat"
      id="chat"
    >

      <div
        class="welcome"
        id="welcome"
      >

        <img
          class="welcome-logo"
          src="/logo.png"
          alt="Nova AI"
        >

        <h1>
          مرحبًا بك في Nova AI
        </h1>

        <p>
          اسألني أي شيء وسأحاول مساعدتك.
        </p>

      </div>

    </section>


    <!-- =========================
         INPUT
    ========================= -->

    <div class="input-area">

      <div class="input-box">

        <input
          type="file"
          id="imageInput"
          accept="image/*"
          style="display:none"
          onchange="handleImageUpload(event)"
        >

        <button
          class="input-button"
          onclick="document.getElementById('imageInput').click()"
          title="إضافة صورة"
        >
          📎
        </button>

        <img
          id="imagePreview"
          class="image-preview"
          alt="صورة"
        >

        <textarea
          id="messageInput"
          placeholder="اكتب رسالتك..."
          rows="1"
          oninput="autoResize(this)"
          onkeydown="handleEnter(event)"
        ></textarea>

        <button
          class="input-button send-button"
          onclick="sendMessage()"
          title="إرسال"
        >
          ↑
        </button>

      </div>

    </div>

  </main>


  <script>

    /* =========================
       STORAGE
    ========================= */

    let conversations =
      JSON.parse(
        localStorage.getItem("nova_conversations") || "[]"
      );

    let currentConversationId =
      localStorage.getItem("nova_current_conversation") || null;

    let selectedImage = null;


    /* =========================
       SAVE
    ========================= */

    function saveConversations() {

      localStorage.setItem(
        "nova_conversations",
        JSON.stringify(conversations)
      );

    }


    /* =========================
       ID
    ========================= */

    function createId() {

      return Date.now().toString()
        + Math.random().toString(36).substring(2);

    }


    /* =========================
       CURRENT CONVERSATION
    ========================= */

    function getCurrentConversation() {

      return conversations.find(
        c => c.id === currentConversationId
      );

    }


    /* =========================
       TITLE
    ========================= */

    function createTitle(text) {

      text = text.trim();

      if (!text) {
        return "محادثة جديدة";
      }

      return text.length > 30
        ? text.substring(0, 30) + "..."
        : text;

    }


    /* =========================
       NEW CHAT
    ========================= */

    function createNewConversation() {

      const conversation = {

        id: createId(),

        title: "محادثة جديدة",

        messages: []

      };

      conversations.unshift(conversation);

      currentConversationId = conversation.id;

      localStorage.setItem(
        "nova_current_conversation",
        currentConversationId
      );

      saveConversations();

      renderHistory();

      renderConversation();

      closeMobileMenu();

    }


    /* =========================
       OPEN CONVERSATION
    ========================= */

    function openConversation(id) {

      currentConversationId = id;

      localStorage.setItem(
        "nova_current_conversation",
        id
      );

      renderHistory();

      renderConversation();

      closeMobileMenu();

    }


    /* =========================
       DELETE CONVERSATION
    ========================= */

    function deleteConversation(id, event) {

      if (event) {
        event.stopPropagation();
      }

      conversations =
        conversations.filter(
          c => c.id !== id
        );

      if (currentConversationId === id) {

        currentConversationId =
          conversations.length
            ? conversations[0].id
            : null;

      }

      if (!currentConversationId) {

        localStorage.removeItem(
          "nova_current_conversation"
        );

        renderHistory();

        renderConversation();

        return;

      }

      localStorage.setItem(
        "nova_current_conversation",
        currentConversationId
      );

      saveConversations();

      renderHistory();

      renderConversation();

    }


    /* =========================
       HISTORY
    ========================= */

    function renderHistory() {

      const history =
        document.getElementById("history");

      history.innerHTML = "";

      conversations.forEach(conversation => {

        const item =
          document.createElement("div");

        item.className =
          "history-item"
          + (
            conversation.id === currentConversationId
              ? " active"
              : ""
          );

        item.onclick = () =>
          openConversation(conversation.id);

        const name =
          document.createElement("div");

        name.className =
          "history-name";

        name.textContent =
          conversation.title;

        const deleteButton =
          document.createElement("button");

        deleteButton.className =
          "delete-history";

        deleteButton.textContent =
          "×";

        deleteButton.onclick =
          (event) =>
            deleteConversation(
              conversation.id,
              event
            );

        item.appendChild(name);

        item.appendChild(deleteButton);

        history.appendChild(item);

      });

    }


    /* =========================
       RENDER CONVERSATION
    ========================= */

    function renderConversation() {

      const chat =
        document.getElementById("chat");

      const welcome =
        document.getElementById("welcome");

      chat.innerHTML = "";

      const conversation =
        getCurrentConversation();

      if (
        !conversation ||
        conversation.messages.length === 0
      ) {

        chat.appendChild(
          createWelcome()
        );

        return;

      }

      conversation.messages.forEach(message => {

        addMessageToScreen(
          message.role,
          message.content,
          message.image
        );

      });

      scrollToBottom();

    }


    /* =========================
       WELCOME
    ========================= */

    function createWelcome() {

      const welcome =
        document.createElement("div");

      welcome.className =
        "welcome";

      welcome.innerHTML = `

        <img
          class="welcome-logo"
          src="/logo.png"
          alt="Nova AI"
        >

        <h1>
          مرحبًا بك في Nova AI
        </h1>

        <p>
          اسألني أي شيء وسأحاول مساعدتك.
        </p>

      `;

      return welcome;

    }


    /* =========================
       RESET
    ========================= */

    function resetChat() {

      const chat =
        document.getElementById("chat");

      chat.innerHTML = "";

      chat.appendChild(
        createWelcome()
      );

    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text;

      return div.innerHTML;

    }


    /* =========================
       FORMAT TEXT
    ========================= */

    function formatText(text) {

      let formatted =
        escapeHtml(text);

      formatted =
        formatted.replace(
          /\*\*(.*?)\*\*/g,
          "<strong>$1</strong>"
        );

      formatted =
        formatted.replace(
          /\n/g,
          "<br>"
        );

      return formatted;

    }


    /* =========================
       ADD MESSAGE
    ========================= */

    function addMessageToScreen(
      role,
      content,
      image
    ) {

      const chat =
        document.getElementById("chat");

      const message =
        document.createElement("div");

      message.className =
        "message "
        + (
          role === "user"
            ? "user"
            : "ai"
        );

      const messageContent =
        document.createElement("div");

      messageContent.className =
        "message-content";

      if (image) {

        const imageElement =
          document.createElement("img");

        imageElement.src =
          image;

        imageElement.className =
          "message-image";

        messageContent.appendChild(
          imageElement
        );

      }

      if (content) {

        const textElement =
          document.createElement("div");

        textElement.innerHTML =
          formatText(content);

        messageContent.appendChild(
          textElement
        );

      }

      if (role === "assistant") {

        const copyButton =
          document.createElement("button");

        copyButton.className =
          "copy-button";

        copyButton.textContent =
          "نسخ";

        copyButton.onclick =
          async () => {

            try {

              await navigator.clipboard.writeText(
                content
              );

              copyButton.textContent =
                "تم النسخ ✓";

              setTimeout(() => {

                copyButton.textContent =
                  "نسخ";

              }, 1500);

            } catch (error) {

              console.error(error);

            }

          };

        messageContent.appendChild(
          copyButton
        );

      }

      message.appendChild(
        messageContent
      );

      chat.appendChild(
        message
      );

    }


    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {

      const input =
        document.getElementById(
          "messageInput"
        );

      const message =
        input.value.trim();

      if (
        !message &&
        !selectedImage
      ) {
        return;
      }


      /* إذا لم توجد محادثة */

      if (!currentConversationId) {

        const conversation = {

          id: createId(),

          title: createTitle(
            message
          ),

          messages: []

        };

        conversations.unshift(
          conversation
        );

        currentConversationId =
          conversation.id;

        localStorage.setItem(
          "nova_current_conversation",
          currentConversationId
        );

      }


      const conversation =
        getCurrentConversation();


      /* أول رسالة = العنوان */

      if (
        conversation.messages.length === 0 &&
        message
      ) {

        conversation.title =
          createTitle(message);

      }


      /* حفظ رسالة المستخدم */

      conversation.messages.push({

        role: "user",

        content: message,

        image: selectedImage

      });


      saveConversations();

      renderHistory();


      /* عرض الرسالة */

      renderConversation();


      const imageToSend =
        selectedImage;


      input.value = "";

      input.style.height =
        "auto";

      clearSelectedImage();


      /* رسالة انتظار */

      addMessageToScreen(
        "assistant",
        "جاري التفكير...",
        null
      );

      scrollToBottom();


      try {

        const history =
          conversation.messages;


        const response =
          await fetch(
            "https://nova-ai-8v6o.onrender.com/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                message:
                  message,

                image:
                  imageToSend,

                history:
                  history.slice(0, -1)

              })

            }
          );


        if (!response.ok) {

          throw new Error(
            "HTTP " + response.status
          );

        }


        const data =
          await response.json();


        /* إزالة رسالة الانتظار */

        conversation.messages =
          conversation.messages.filter(
            msg =>
              !(
                msg.role === "assistant" &&
                msg.content === "جاري التفكير..."
              )
          );


        const answer =
          data.reply ||
          data.message ||
          data.response ||
          "لم يتم الحصول على إجابة.";


        conversation.messages.push({

          role: "assistant",

          content: answer,

          image: null

        });


        saveConversations();

        renderConversation();

        renderHistory();

        scrollToBottom();


      } catch (error) {

        console.error(error);


        conversation.messages =
          conversation.messages.filter(
            msg =>
              !(
                msg.role === "assistant" &&
                msg.content === "جاري التفكير..."
              )
          );


        conversation.messages.push({

          role: "assistant",

          content:
            "حدث خطأ أثناء الاتصال بالخادم. حاول مرة أخرى.",

          image: null

        });


        saveConversations();

        renderConversation();

        renderHistory();

      }

    }


    /* =========================
       IMAGE UPLOAD
    ========================= */

    function handleImageUpload(event) {

      const file =
        event.target.files[0];

      if (!file) {
        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        function(e) {

          selectedImage =
            e.target.result;


          const preview =
            document.getElementById(
              "imagePreview"
            );


          preview.src =
            selectedImage;


          preview.style.display =
            "block";

        };


      reader.readAsDataURL(file);

    }


    /* =========================
       CLEAR IMAGE
    ========================= */

    function clearSelectedImage() {

      selectedImage =
        null;


      const preview =
        document.getElementById(
          "imagePreview"
        );


      preview.src =
        "";


      preview.style.display =
        "none";


      const input =
        document.getElementById(
          "imageInput"
        );


      input.value =
        "";

    }


    /* =========================
       TEXTAREA RESIZE
    ========================= */

    function autoResize(textarea) {

      textarea.style.height =
        "auto";

      textarea.style.height =
        Math.min(
          textarea.scrollHeight,
          160
        ) + "px";

    }


    /* =========================
       ENTER
    ========================= */

    function handleEnter(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }


    /* =========================
       SCROLL
    ========================= */

    function scrollToBottom() {

      const chat =
        document.getElementById("chat");

      setTimeout(() => {

        chat.scrollTop =
          chat.scrollHeight;

      }, 50);

    }


    /* =========================
       MOBILE MENU
    ========================= */

    function openMobileMenu() {

      document
        .getElementById("sidebar")
        .classList
        .add("open");

    }


    function closeMobileMenu() {

      document
        .getElementById("sidebar")
        .classList
        .remove("open");

    }


    /* =========================
       START
    ========================= */

    function init() {

      if (
        !currentConversationId ||
        !getCurrentConversation()
      ) {

        if (conversations.length) {

          currentConversationId =
            conversations[0].id;

          localStorage.setItem(
            "nova_current_conversation",
            currentConversationId
          );

        }

      }

      renderHistory();

      renderConversation();

    }


    init();

  </script>

</body>

</html>
